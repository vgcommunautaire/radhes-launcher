<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' data:">
  <title>Radhes Launcher</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="titlebar"><span id="tb-heart" class="tb-heart"></span><span>RADHES LAUNCHER</span></div>
  <canvas id="embers" aria-hidden="true"></canvas>
  <div class="vignette" aria-hidden="true"></div>
  <div id="update-banner" class="banner" hidden></div>

  <!-- ===== Accueil ===== -->
  <main id="view-home" class="view">
    <section class="home-left">
      <h1 class="title-red">HARDCORE</h1>
      <div class="title-rule"><span></span></div>
      <h2 class="title-white">RADHES</h2>
      <p class="subtitle"><span class="dash"></span>Si l'un tombe, tous tombent.</p>

      <button id="play" class="btn-big" hidden><span class="icon" data-icon="play"></span><span id="play-label">JOUER</span></button>
      <button id="login" class="btn-big long" hidden><span class="icon" data-icon="play"></span><span>SE CONNECTER</span></button>

      <div id="progress" class="progress" hidden>
        <div id="hearts" class="hearts" aria-hidden="true"></div>
        <span id="progress-label"></span>
      </div>
      <p id="error" class="error" role="alert" hidden></p>

      <nav class="menu">
        <button data-view="settings">OPTIONS</button>
      </nav>

      <footer class="credit">Un launcher de RADHES · <span id="version"></span></footer>
    </section>

    <aside class="home-right">
      <div class="card account">
        <canvas id="head" width="64" height="64"></canvas>
        <div>
          <div id="account-name" class="account-name">INVITÉ</div>
          <div id="account-status" class="account-status">Non connecté</div>
        </div>
      </div>

      <div id="tip-card" class="card tip">
        <div class="label">LE SAVAIS-TU ?</div>
        <div id="tip-title" class="tip-title"></div>
        <div id="tip-text" class="tip-text"></div>
      </div>
    </aside>
  </main>

  <!-- ===== Options ===== -->
  <section id="view-settings" class="view page" hidden>
    <h1 class="page-title white left">OPTIONS</h1>
    <div class="grid" id="settings-grid">
      <div class="tile accent-cyan">
        <span class="tile-icon" data-icon="ram"></span>
        <div class="tile-text"><span class="tile-title">MÉMOIRE</span><span class="tile-sub">RAM donnée au jeu</span></div>
        <div class="stepper"><button id="ram-down" aria-label="Moins">◀</button><span id="ram-value">4 Go</span><button id="ram-up" aria-label="Plus">▶</button></div>
      </div>
      <button class="tile accent-purple" data-folder="resourcepacks">
        <span class="tile-icon" data-icon="frame"></span>
        <div class="tile-text"><span class="tile-title">PACKS DE TEXTURES</span><span class="tile-sub">Les packs officiels sont remis à chaque lancement</span></div>
      </button>
      <button class="tile accent-yellow" data-folder="shaderpacks">
        <span class="tile-icon" data-icon="sun"></span>
        <div class="tile-text"><span class="tile-title">SHADERS</span><span class="tile-sub">Ouvrir le dossier</span></div>
      </button>
      <button class="tile accent-green" data-folder="screenshots">
        <span class="tile-icon" data-icon="camera"></span>
        <div class="tile-text"><span class="tile-title">CAPTURES D'ÉCRAN</span><span class="tile-sub">Tes plus beaux moments</span></div>
      </button>
      <button id="verify" class="tile accent-orange">
        <span class="tile-icon" data-icon="wrench"></span>
        <div class="tile-text"><span class="tile-title">RÉPARER LE JEU</span><span class="tile-sub">Tout vérifier, puis jouer</span></div>
      </button>
      <button class="tile accent-grey" data-folder="logs">
        <span class="tile-icon" data-icon="paper"></span>
        <div class="tile-text"><span class="tile-title">JOURNAUX</span><span class="tile-sub">Pour signaler un problème</span></div>
      </button>
      <button id="sounds" class="tile accent-blue">
        <span class="tile-icon" data-icon="note"></span>
        <div class="tile-text"><span class="tile-title">SONS DU LAUNCHER</span><span id="sounds-sub" class="tile-sub">Activés</span></div>
      </button>
      <button id="logout" class="tile accent-red">
        <span class="tile-icon" data-icon="door"></span>
        <div class="tile-text"><span class="tile-title">SE DÉCONNECTER</span><span class="tile-sub">Changer de compte</span></div>
      </button>
    </div>
    <button class="btn-back" data-view="home"><span class="icon" data-icon="back"></span>RETOUR</button>
  </section>

  <script src="app.js"></script>
</body>
</html>
